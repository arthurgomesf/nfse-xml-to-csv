[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nfse-extractor"
version = "1.0.0"
description = "Consolida XMLs de NFS-e (padrão nacional) em uma base CSV para conciliação com o ERP via BI."
readme = "README.md"
license = "MIT"
authors = [{ name = "Arthur Gomes" }]
requires-python = ">=3.11"
dependencies = []  # somente biblioteca padrão
keywords = ["nfse", "nota fiscal", "xml", "etl", "power bi", "sap business one", "fiscal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Portuguese (Brazilian)",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Repository = "https://github.com/arthurgomesf/nfse-xml-to-csv"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
nfse-extractor = "nfse_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --import-mode=importlib"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caracteres como º e ° são intencionais
