name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Testes
        run: pytest --cov=nfse_extractor --cov-report=term-missing

      - name: Demo com os exemplos
        run: python -m nfse_extractor -c exemplos/config.toml
